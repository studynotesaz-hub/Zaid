<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Zaid | The Architect of Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Italiana&family=Manrope:wght@200;400;500;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #050505;
        --text-color: #e1e1e1;
        --accent-color: #888;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        cursor: none; /* Custom cursor */
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Noise Grain Overlay */
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9998;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
      }

      /* Scrollbar Hide */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }

      /* Typography Utilities */
      .font-display { font-family: 'Syncopate', sans-serif; }
      .font-body { font-family: 'Manrope', sans-serif; }
      .font-serif-accent { font-family: 'Italiana', serif; }
      .font-cursive { font-family: 'Allura', cursive; }
      
      ::selection {
        background: #ffffff;
        color: #000000;
      }
    </style>

</head>
